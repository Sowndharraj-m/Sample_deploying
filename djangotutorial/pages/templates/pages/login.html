{% extends 'pages/base.html' %}

{% block title %}Log In | MySite{% endblock %}

{% block extra_styles %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 40px 0;
    }

    .auth-card {
        width: 100%;
        max-width: 460px;
        padding: 48px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        animation: fadeInUp 0.6s ease;
    }

    .auth-card h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 8px;
        text-align: center;
    }

    .auth-card h1 span {
        background: linear-gradient(135deg, var(--primary-light), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .auth-subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin-bottom: 36px;
    }

    .auth-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 28px 0;
        color: var(--text-secondary);
        font-size: 0.85rem;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .auth-footer {
        text-align: center;
        margin-top: 28px;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .auth-footer a {
        color: var(--primary-light);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
    }

    .auth-footer a:hover {
        color: var(--accent);
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 32px 24px;
            margin: 0 16px;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card">
        <h1>Welcome <span>Back</span></h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Enter your username" required
                    autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary btn-full">Sign In →</button>
        </form>

        <div class="auth-divider">or</div>

        <p class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Create one</a>
        </p>
    </div>
</section>
{% endblock %}
